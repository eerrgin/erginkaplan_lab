<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curious Pulse — eerrgin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="content">
    <header>
      <span class="tag">01 — EXPERIENCE</span>
      <h1>Curious Pulse</h1>
      <p class="subtitle">Ideas → code → reality</p>
    </header>

    <div class="clock-wrapper">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date"></div>
    </div>

    <div class="interaction">
      <p class="hint">Move. Click. Stay curious.</p>
      <button id="spark" class="spark-btn">Spark an idea</button>
      <div id="idea" class="idea"></div>
    </div>

    <footer>
      <span>Build. Learn. Repeat.</span>
      <span class="author">eerrgin</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
